services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: binn
      POSTGRES_PASSWORD: binn
      POSTGRES_DB: binn_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binn -d binn_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BINN_DATABASE_URL: postgresql+asyncpg://binn:binn@db:5432/binn_agent
      BINN_REDIS_URL: redis://redis:6379/0
      BINN_OLLAMA_BASE_URL: http://host.docker.internal:11434
      BINN_OLLAMA_CHAT_MODEL: ${BINN_OLLAMA_CHAT_MODEL:-gemma4:e2b}
      BINN_OLLAMA_UTILITY_MODEL: ${BINN_OLLAMA_UTILITY_MODEL:-gemma4:e2b}
      BINN_OLLAMA_EMBEDDING_MODEL: ${BINN_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      BINN_MODEL_PROVIDER: ${BINN_MODEL_PROVIDER:-ollama}
      BINN_DEEPSEEK_BASE_URL: ${BINN_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      BINN_DEEPSEEK_API_KEY: ${BINN_DEEPSEEK_API_KEY:-}
      BINN_DEEPSEEK_CHAT_MODEL: ${BINN_DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      BINN_DEEPSEEK_UTILITY_MODEL: ${BINN_DEEPSEEK_UTILITY_MODEL:-deepseek-v4-flash}
      BINN_LONGCAT_BASE_URL: ${BINN_LONGCAT_BASE_URL:-https://api.longcat.chat/openai}
      BINN_LONGCAT_API_KEY: ${BINN_LONGCAT_API_KEY:-}
      BINN_LONGCAT_CHAT_MODEL: ${BINN_LONGCAT_CHAT_MODEL:-LongCat-2.0}
      BINN_LONGCAT_UTILITY_MODEL: ${BINN_LONGCAT_UTILITY_MODEL:-LongCat-2.0}
      BINN_KNOWLEDGE_UPLOAD_DIR: /app/var/knowledge/uploads
      BINN_LANGFUSE_ENABLED: ${BINN_LANGFUSE_ENABLED:-false}
      BINN_LANGFUSE_PUBLIC_KEY: ${BINN_LANGFUSE_PUBLIC_KEY:-}
      BINN_LANGFUSE_SECRET_KEY: ${BINN_LANGFUSE_SECRET_KEY:-}
      BINN_LANGFUSE_BASE_URL: ${BINN_LANGFUSE_DOCKER_BASE_URL:-http://host.docker.internal:3100}
      BINN_LANGFUSE_ENVIRONMENT: ${BINN_LANGFUSE_ENVIRONMENT:-development}
      BINN_FEISHU_MCP_ENABLED: ${BINN_FEISHU_MCP_ENABLED:-false}
      BINN_FEISHU_MCP_TRANSPORT: ${BINN_FEISHU_MCP_TRANSPORT:-http}
      BINN_FEISHU_MCP_URL: ${BINN_FEISHU_MCP_DOCKER_URL:-http://host.docker.internal:8765/mcp}
      BINN_FEISHU_APP_ID: ${BINN_FEISHU_APP_ID:-}
      BINN_FEISHU_APP_SECRET: ${BINN_FEISHU_APP_SECRET:-}
      BINN_FEISHU_OPENAPI_FALLBACK_ENABLED: ${BINN_FEISHU_OPENAPI_FALLBACK_ENABLED:-true}
      BINN_DEBUG_CONSOLE_ENABLED: ${BINN_DEBUG_CONSOLE_ENABLED:-false}
      BINN_DEBUG_CONSOLE_TOKEN: ${BINN_DEBUG_CONSOLE_TOKEN:-}
      BINN_DEBUG_CONSOLE_ALLOWED_ORIGINS: '${BINN_DEBUG_CONSOLE_ALLOWED_ORIGINS:-["http://localhost:5176","http://127.0.0.1:5176"]}'
      BINN_EMAIL_DELIVERY_MODE: ${BINN_EMAIL_DELIVERY_MODE:-console}
      BINN_EMAIL_VERIFICATION_SECRET: ${BINN_EMAIL_VERIFICATION_SECRET:-local-email-verification-secret-change-me}
      BINN_SMTP_HOST: ${BINN_SMTP_HOST:-}
      BINN_SMTP_PORT: ${BINN_SMTP_PORT:-587}
      BINN_SMTP_USERNAME: ${BINN_SMTP_USERNAME:-}
      BINN_SMTP_PASSWORD: ${BINN_SMTP_PASSWORD:-}
      BINN_SMTP_FROM_ADDRESS: ${BINN_SMTP_FROM_ADDRESS:-no-reply@binnagent.local}
      BINN_SMTP_STARTTLS: ${BINN_SMTP_STARTTLS:-true}
      BINN_SMTP_USE_SSL: ${BINN_SMTP_USE_SSL:-false}
    volumes:
      - knowledge_data:/app/var/knowledge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  exercise-worker:
    build: .
    restart: unless-stopped
    command: python scripts/run_exercise_worker.py
    environment:
      BINN_DATABASE_URL: postgresql+asyncpg://binn:binn@db:5432/binn_agent
      BINN_MODEL_PROVIDER: ${BINN_MODEL_PROVIDER:-ollama}
      BINN_OLLAMA_BASE_URL: http://host.docker.internal:11434
      BINN_OLLAMA_CHAT_MODEL: ${BINN_OLLAMA_CHAT_MODEL:-gemma4:e2b}
      BINN_OLLAMA_UTILITY_MODEL: ${BINN_OLLAMA_UTILITY_MODEL:-gemma4:e2b}
      BINN_DEEPSEEK_BASE_URL: ${BINN_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      BINN_DEEPSEEK_API_KEY: ${BINN_DEEPSEEK_API_KEY:-}
      BINN_DEEPSEEK_CHAT_MODEL: ${BINN_DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      BINN_DEEPSEEK_UTILITY_MODEL: ${BINN_DEEPSEEK_UTILITY_MODEL:-deepseek-v4-flash}
      BINN_LONGCAT_BASE_URL: ${BINN_LONGCAT_BASE_URL:-https://api.longcat.chat/openai}
      BINN_LONGCAT_API_KEY: ${BINN_LONGCAT_API_KEY:-}
      BINN_LONGCAT_CHAT_MODEL: ${BINN_LONGCAT_CHAT_MODEL:-LongCat-2.0}
      BINN_LONGCAT_UTILITY_MODEL: ${BINN_LONGCAT_UTILITY_MODEL:-LongCat-2.0}
      BINN_LANGFUSE_ENABLED: ${BINN_LANGFUSE_ENABLED:-false}
      BINN_LANGFUSE_PUBLIC_KEY: ${BINN_LANGFUSE_PUBLIC_KEY:-}
      BINN_LANGFUSE_SECRET_KEY: ${BINN_LANGFUSE_SECRET_KEY:-}
      BINN_LANGFUSE_BASE_URL: ${BINN_LANGFUSE_DOCKER_BASE_URL:-http://host.docker.internal:3100}
      BINN_LANGFUSE_ENVIRONMENT: ${BINN_LANGFUSE_ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  knowledge_data:
